<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c232c" />
      <stop offset="100%" stop-color="#040f14" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="20" y1="20" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#eaf5f4" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8d75" />
      <stop offset="100%" stop-color="#ff5238" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle for app icon / favicon -->
  <rect width="180" height="180" rx="42" fill="url(#bgGrad)" />
  <rect width="176" height="176" x="2" y="2" rx="40" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.3" />

  <!-- Outer Flash Ring -->
  <circle cx="90" cy="90" r="62" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- 3 Flash Bars rotated at -18 degrees -->
  <g transform="rotate(-18 90 90)">
    <!-- Bar 1 (Short left) -->
    <rect x="63" y="69" width="12" height="42" rx="6" fill="url(#coralGrad)" filter="url(#glow)" />
    <!-- Bar 2 (Medium center) -->
    <rect x="84" y="57" width="12" height="66" rx="6" fill="url(#coralGrad)" filter="url(#glow)" />
    <!-- Bar 3 (Tall right) -->
    <rect x="105" y="45" width="12" height="90" rx="6" fill="url(#coralGrad)" filter="url(#glow)" />
  </g>
</svg>
